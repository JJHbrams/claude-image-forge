<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="banner-forge — sequential-fallback image generation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1018"/>
      <stop offset="0.55" stop-color="#0D2029"/>
      <stop offset="1" stop-color="#103038"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4A7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4A7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2DD4A7" stop-opacity="0.08"/>
    </linearGradient>
    <!-- A flat circle with opacity has a hard edge and reads as a smudge.
         A radial stop falling to zero is what actually looks like light. -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4A7" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#2DD4A7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2DD4A7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3C0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- glow behind the chain, keeps the right half from reading as empty -->
  <ellipse cx="900" cy="150" rx="300" ry="215" fill="url(#glow)"/>

  <!-- left: wordmark -->
  <g transform="translate(80 108)">
    <rect x="0" y="-34" width="3" height="76" fill="url(#fade)"/>
    <text x="24" y="10" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
          font-size="58" font-weight="700" letter-spacing="-1.5" fill="#EAF6F3">banner<tspan fill="url(#accent)">-forge</tspan></text>
    <text x="26" y="52" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
          font-size="19" font-weight="400" letter-spacing="0.4" fill="#7E9AA3">sequential-fallback image generation</text>
    <text x="26" y="92" font-family="Consolas, SF Mono, Menlo, monospace"
          font-size="14.5" letter-spacing="0.2" fill="#55707A">codex → agy → gemini → svg</text>
  </g>

  <!-- right: the chain, drawn as it actually behaves -->
  <g transform="translate(742 62)" font-family="Consolas, SF Mono, Menlo, monospace" font-size="13">
    <!-- spine -->
    <line x1="14" y1="16" x2="14" y2="160" stroke="#2A4750" stroke-width="2"/>

    <g>
      <circle cx="14" cy="16" r="6" fill="#0D2029" stroke="#43626C" stroke-width="2"/>
      <text x="40" y="21" fill="#8FA9B1">T1</text>
      <text x="78" y="21" fill="#B9CDD3">codex</text>
      <text x="280" y="21" fill="#546F78" text-anchor="end">quota</text>
    </g>
    <g>
      <circle cx="14" cy="64" r="6" fill="#0D2029" stroke="#43626C" stroke-width="2"/>
      <text x="40" y="69" fill="#8FA9B1">T2</text>
      <text x="78" y="69" fill="#B9CDD3">agy</text>
      <text x="280" y="69" fill="#546F78" text-anchor="end">500</text>
    </g>
    <g>
      <circle cx="14" cy="112" r="6" fill="#0D2029" stroke="#43626C" stroke-width="2"/>
      <text x="40" y="117" fill="#8FA9B1">T2b</text>
      <text x="78" y="117" fill="#B9CDD3">gemini</text>
      <text x="280" y="117" fill="#546F78" text-anchor="end">limit 0</text>
    </g>
    <g>
      <circle cx="14" cy="160" r="7" fill="#2DD4A7"/>
      <circle cx="14" cy="160" r="13" fill="none" stroke="#2DD4A7" stroke-opacity="0.35" stroke-width="2"/>
      <text x="40" y="165" fill="#2DD4A7">T3</text>
      <text x="78" y="165" fill="#EAF6F3">svg</text>
      <text x="280" y="165" fill="#2DD4A7" text-anchor="end">you are here</text>
    </g>
  </g>

  <rect y="296" width="1200" height="4" fill="url(#accent)" opacity="0.8"/>
</svg>
